name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

jobs:
  tests:
    name: Windows / Python ${{ matrix.python }}
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13', '3.14']
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Create isolated test environment
        run: |
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { throw 'Test environment creation failed.' }
          Add-Content -LiteralPath $env:GITHUB_PATH -Value (Join-Path $env:GITHUB_WORKSPACE '.venv\Scripts')
      - name: Install pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: -r requirements.txt
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Compile application modules
        run: python -m compileall -q optimizer main.py scripts
      - name: Run offline tests
        run: |
          New-Item -ItemType Directory -Path data -Force | Out-Null
          python -m pytest tests -q -p no:cacheprovider --basetemp data/test-temp --junitxml=data/test-results.xml
      - name: Save test report
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: test-report-python-${{ matrix.python }}
          path: data/test-results.xml
          if-no-files-found: warn
          retention-days: 7

  engineering-workflow:
    name: Engineering workflow and session protocol
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Run workflow isolation and ownership checks
        run: pwsh -NoProfile -File .\Engineering\tests\workflow.tests.ps1
      - name: Run end-of-session protocol checks
        run: pwsh -NoProfile -File .\Engineering\tests\session-protocol.tests.ps1
      # Engineering/tests/github-contract.tests.ps1 is deliberately excluded: it builds a
      # native CLI fixture with the Windows .NET Framework compiler and is run locally.

  package:
    name: Build and verify Windows source bundle
    needs: tests
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Package tracked runtime files
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: ./scripts/build-release.ps1 -Tag $env:RELEASE_TAG
      - name: Verify bundle contents and checksum
        run: python scripts/verify_release.py dist
      - name: Save Windows source bundle
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: windows-source
          path: dist/*
          if-no-files-found: error
          retention-days: 14
